name: Issue to CSV Row

on:
  issues:
    types: [labeled]

concurrency:
  group: csv-update
  cancel-in-progress: false

jobs:
  add-to-register-direct:
    if: github.event.label.name == 'new risk' && vars.WORKSHOP_AUTO_PUBLISH_NEW_RISKS == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Synchronise with latest default branch
        run: git pull --ff-only origin "${{ github.event.repository.default_branch }}"

      - name: Debug issue body
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: echo "$ISSUE_BODY"

      - name: Parse issue and append to CSV
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: python .github/scripts/issue_to_csv.py

      - name: Install render dependencies
        run: pip install pandas

      - name: Regenerate site data
        run: python .github/scripts/render_table.py

      - name: Commit directly to default branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add register/risks.csv docs/index.html docs/risks.json
          if git diff --cached --quiet; then
            echo "No CSV changes detected"
            exit 0
          fi
          git commit -m "Add risk from issue #${{ github.event.issue.number }}"
          git push origin HEAD:${{ github.event.repository.default_branch }}

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs

  add-to-register-pr:
    if: github.event.label.name == 'new risk' && vars.WORKSHOP_AUTO_PUBLISH_NEW_RISKS != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Debug issue body
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: echo "$ISSUE_BODY"

      - name: Parse issue and append to CSV
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: python .github/scripts/issue_to_csv.py

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Add risk from issue #${{ github.event.issue.number }}"
          title: "Add risk: ${{ github.event.issue.title }}"
          body: "Automatically generated from issue #${{ github.event.issue.number }}"
          branch: "risk/issue-${{ github.event.issue.number }}"
          labels: "auto-generated"

