name: Propose a new risk
description: Suggest a new row for the AI-RSE risk register
labels: ["new risk"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form to propose a new risk for the register.

        Please check whether a similar risk is already listed before submitting. If you want to revise an existing entry instead, use the **Update an existing risk** form.

        You do not need to complete every optional field for your contribution to be useful.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the risk in practical terms. What could go wrong, who might be affected, and what the consequences could be?
    validations:
      required: true
  - type: dropdown
    id: likelihood
    attributes:
      label: Likelihood
      options: [Very Low, Low, Medium, High, Very High, Unknown]
      description: How likely is this risk to arise in normal research software practice?
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options: [Very Low, Low, Medium, High, Very High, Unknown]
      description: If this risk occurs, how serious would the consequences be?
    validations:
      required: true
  - type: dropdown
    id: reach
    attributes:
      label: Reach
      options: [Very Low, Low, Medium, High, Very High, Unknown]
      description: How widely would the effects of this risk be felt across people, projects, or institutions?
    validations:
      required: true
  - type: textarea
    id: mitigations
    attributes:
      label: Mitigations
      description: Describe how the risk might be mitigated or avoided. For example, through policy, training, review practices, or technical safeguards.
  - type: textarea
    id: ownership
    attributes:
      label: Ownership
      description: Who is responsible for managing this risk? For example, practitioners, team leads, institutions, funders, or tool developers.
  - type: textarea
    id: examples
    attributes:
      label: Examples
      description: Provide relevant examples, case studies, incidents, or policies from institutions or organisations that have identified or managed this risk. Include links where possible.
  - type: dropdown
    id: tags
    attributes:
      label: Tags
      description: Select any tags that apply to this risk. Exact tagging can be refined later by maintainers.
      multiple: true
      options:
        - Economic
        - Environmental
        - Equity and Fairness
        - Governance
        - People and Professional Practice
        - Privacy and Security
        - Research Integrity
        - Software Sustainability
        - Training and Development
        - Wider Societal Impacts
  - type: textarea
    id: other_tags
    attributes:
      label: Other Tags
      description: If needed, add any other tags not listed above. Separate multiple entries with commas.
