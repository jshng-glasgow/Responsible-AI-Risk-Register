name: Update an existing risk
description: Update an existing row in the AI-RSE risk register
labels: ["risk update"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form to improve or revise an existing risk entry.

        Enter the issue number for the risk you want to update, then fill in only the fields you want to change. Leave any other fields blank.
  - type: textarea
    id: issue_number
    attributes:
      label: Issue Number
      description: Enter the issue number for the existing risk entry, for example `#48`. You can find this in the register's `Issue` field.
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: If you want to change the wording, describe the risk in practical terms. What could go wrong, who might be affected, and what the consequences could be?
      placeholder: Leave blank if you are not proposing a change to the description.
    validations:
      required: false
  - type: dropdown
    id: likelihood
    attributes:
      label: Likelihood
      options: [Very Low, Low, Medium, High, Very High, Unknown]
      description: How likely is this risk to arise in normal research software practice?
    validations:
      required: false
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options: [Very Low, Low, Medium, High, Very High, Unknown]
      description: If this risk occurs, how serious would the consequences be?
    validations:
      required: false
  - type: dropdown
    id: reach
    attributes:
      label: Reach
      options: [Very Low, Low, Medium, High, Very High, Unknown]
      description: How widely would the effects of this risk be felt across people, projects, or institutions?
    validations:
      required: false
  - type: textarea
    id: mitigations
    attributes:
      label: Mitigations
      description: Describe how the risk might be mitigated or avoided. For example, through policy, training, review practices, or technical safeguards.
  - type: textarea
    id: ownership
    attributes:
      label: Ownership
      description: Who is responsible for managing this risk? For example, practitioners, team leads, institutions, funders, or tool developers.
  - type: textarea
    id: examples
    attributes:
      label: Examples
      description: Provide relevant examples, case studies, incidents, or policies from institutions or organisations that have identified or managed this risk. Include links where possible.
  - type: textarea
    id: related_risks
    attributes:
      label: Related Risks
      description: Optionally add or revise related issue numbers for overlapping risks. Use values like `#12` or `#12, #48`. Leave blank if you are not proposing a change.
  - type: dropdown
    id: tags
    attributes:
      label: Tags
      description: Select any tags that apply to this risk. Exact tagging can be refined later by maintainers.
      multiple: true
      options:
        - Economic
        - Environmental
        - Professional
        - Training and Development
        - Research Integrity
        - Privacy and Security
        - Equity
        - Societal
        - Governance
        - Software Sustainability
  - type: textarea
    id: other_tags
    attributes:
      label: Other Tags
      description: If needed, add any other tags not listed above. Separate multiple entries with commas.

