name: Update an existing risk
description: Update an existing row in the AI-RSE risk register
labels: ["risk update"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form to improve or revise an existing risk entry.

        **This is a patch form:** only fields you explicitly change will be updated. Blank fields and **No changes** selections preserve the current register values.

        The safest route is to open this form using **Propose an update** on the expanded risk card. The register entry will remain open in the original browser tab for comparison.
  - type: textarea
    id: issue_number
    attributes:
      label: Issue Number
      description: Enter the issue number for the existing risk entry, for example `#48`. You can find this in the register's `Issue` field.
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: If you want to change the wording, describe the risk in practical terms. What could go wrong, who might be affected, and what the consequences could be?
      placeholder: Leave blank if you are not proposing a change to the description.
    validations:
      required: false
  - type: dropdown
    id: likelihood
    attributes:
      label: Likelihood
      options: [No changes, Very Low, Low, Medium, High, Very High, Unknown]
      default: 0
      description: Select a new likelihood, or keep **No changes** to preserve the current value.
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options: [No changes, Very Low, Low, Medium, High, Very High, Unknown]
      default: 0
      description: Select a new severity, or keep **No changes** to preserve the current value.
    validations:
      required: true
  - type: dropdown
    id: reach
    attributes:
      label: Reach
      options: [No changes, Very Low, Low, Medium, High, Very High, Unknown]
      default: 0
      description: Select a new reach, or keep **No changes** to preserve the current value.
    validations:
      required: true
  - type: textarea
    id: mitigations
    attributes:
      label: Mitigations
      description: Describe how the risk might be mitigated or avoided. For example, through policy, training, review practices, or technical safeguards.
      placeholder: Leave blank if you are not proposing a change to the mitigations.
  - type: textarea
    id: ownership
    attributes:
      label: Ownership
      description: Who is responsible for managing this risk? For example, practitioners, team leads, institutions, funders, or tool developers.
      placeholder: Leave blank if you are not proposing a change to the ownership.
  - type: textarea
    id: best_practice_examples
    attributes:
      label: Best Practice Examples
      description: Provide examples of institutions or organisations handling this risk well, such as effective policies, safeguards, or management approaches. Include links where possible; do not use this field for examples of the risk occurring.
      placeholder: Leave blank if you are not proposing a change to the best practice examples.
  - type: textarea
    id: related_risks
    attributes:
      label: Related Risks
      description: Optionally add or revise related issue numbers for overlapping risks. Use values like `#12` or `#12, #48`. Leave blank if you are not proposing a change.
  - type: dropdown
    id: tags_action
    attributes:
      label: Tags Action
      description: Changing tags replaces the complete tag list, so choose this explicitly.
      options:
        - No changes
        - Replace with selected tags
        - Clear all tags
      default: 0
    validations:
      required: true
  - type: dropdown
    id: tags
    attributes:
      label: Tags
      description: Used only when **Tags Action** is set to **Replace with selected tags**. Select every tag that should remain on the risk.
      multiple: true
      options:
        - Economic
        - Environmental
        - Professional
        - Training and Development
        - Research Integrity
        - Privacy and Security
        - Equity
        - Societal
        - Governance
        - Software Sustainability
  - type: textarea
    id: other_tags
    attributes:
      label: Other Tags
      description: If needed, add any other tags not listed above. Separate multiple entries with commas.
      placeholder: Leave blank unless you are replacing the current tags and need an additional tag.

